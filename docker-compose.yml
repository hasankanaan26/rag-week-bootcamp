# ============================================================
# Docker Compose — App + ChromaDB
# ============================================================
# ChromaDB is included but only used from Checkpoint 2 onward.
# Students can run just the app for Checkpoint 1.
# ============================================================

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app

  chromadb:
    image: chromadb/chroma:0.6.3
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # Postgres + pgvector — used when VECTOR_STORE=postgres (Checkpoint 4).
  # Start just the database:  docker compose up -d pgvector
  # Connect from pgAdmin:     localhost:5434, user rag, password rag, db rag_bootcamp
  # Port 5434 avoids clashing with a locally installed Postgres on 5432.
  pgvector:
    image: pgvector/pgvector:pg16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_bootcamp
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  chroma_data:
  pg_data:
